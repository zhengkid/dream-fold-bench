<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dream-Folding-Bench · replay of a session</title>
<link rel="stylesheet" href="css/style.css?v=50b88226">
<style>
  body.capture { width: 1280px; height: 720px; overflow: hidden; background: #fff; }
  body.capture .replay .log, body.capture .replay .view { height: 488px; }
  body.capture .replay .bar { font-size: 14px; padding: 14px 20px; }
  body.capture .replay .log .ln { font-size: 13px; }
  body.capture .replay .log .head, body.capture .replay .view .head { font-size: 11.5px; }
  body.capture .replay .view .badge .big { font-size: 40px; }
  body.capture .replay .view .badge .small, body.capture .replay .view .key { font-size: 11.5px; }
  body.capture .replay .timeline text { font-size: 12px; }
  .page { max-width: 1180px; margin: 28px auto; padding: 0 20px; }
</style>
</head>
<body>
<div class="page" id="page"><div id="replay"></div></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search), t = q.get("t") || "T1274", capture = q.get("capture") === "1";
    if (capture) { document.body.className = "capture"; var p = document.getElementById("page"); p.style.margin = "0"; p.style.padding = "0"; p.style.maxWidth = "none"; }
    var s = document.createElement("script");
    s.src = "data/replay_" + t.replace(/[^A-Za-z0-9]/g, "") + ".js";
    s.onload = function () { var r = document.createElement("script"); r.src = "js/replay.js"; r.onload = function () {
      window.__replay = window.DFBReplayView(document.getElementById("replay"), window.DFB_REPLAY[t], { capture: capture, frames: q.get("frames") });
      if (!capture && q.get("play") !== "0") window.__replay.play();
    }; document.body.appendChild(r); };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
